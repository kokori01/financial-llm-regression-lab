[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-llm-regression-lab"
version = "0.2.0"
description = "A small deterministic financial QA regression harness with synthetic offline replay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
live = ["openai>=2,<3"]

[project.scripts]
financial-lab = "regression_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
regression_lab = ["resources/data/*.json", "resources/fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
